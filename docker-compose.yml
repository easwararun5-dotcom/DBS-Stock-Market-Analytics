services:
  dbs_timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: dbs_timescaledb
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: stock_timescale_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_timescale_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  timescaledb_data:
